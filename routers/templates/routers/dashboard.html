<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Router Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #007bff;
            margin-bottom: 30px;
            text-align: center;
        }
        .router-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .router-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .status-badge {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 12px;
            color: #fff;
        }
        .online {
            background-color: #28a745;
        }
        .offline {
            background-color: #dc3545;
        }
        .router-info p {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h1>Router Dashboard</h1>

    {% if routers %}
        <!-- Router Cards -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for router in routers %}
            <div class="col">
                <div class="router-card">
                    <h5>{{ router.name }}</h5>
                    <p>Status: 
                        <span class="status-badge {% if router.status == 'online' %}online{% else %}offline{% endif %}">
                            {{ router.status|title }}
                        </span>
                    </p>
                    <p>Active Users: {{ router.users|length }}</p>
                    <p>IP Address: {{ router.ip }}</p>
                    <div class="d-flex gap-2 mt-3">
                        <a class="btn btn-sm btn-primary" href="{% url 'router_script' router.id %}">WinBox Script</a>
                        <form method="post" action="{% url 'delete_router' router.id %}" onsubmit="return confirm('Delete this router and its connection token?');">
                            {% csrf_token %}
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-warning text-center mt-4">
            No routers found.
        </div>
    {% endif %}
</div>

</body>
</html>
