<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netcore Wi-Fi Billing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            min-height: 100vh;
        }
        .hero {
            padding: 80px 20px;
            text-align: center;
        }
        .card {
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="container hero">
        <h1 class="display-4 fw-bold">Netcore Wi-Fi Billing System</h1>
        <p class="lead mt-3">Manage clients, routers, packages, vouchers, and Wi-Fi access from one place.</p>
        <div class="mt-4">
            <a class="btn btn-light btn-lg me-2" href="/accounts/login/">Login</a>
            <a class="btn btn-outline-light btn-lg" href="/dashboard/">Open Dashboard</a>
        </div>

        <div class="row mt-5 justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h5>Client Portal</h5>
                    <p>Track routers, services, packages, vouchers, and receipts.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <h5>Wi-Fi Access</h5>
                    <p>Support login, voucher activation, and customer billing workflows.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
